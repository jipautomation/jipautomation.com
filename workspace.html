<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workspace · Jip Automation</title>
<meta name="description" content="Client workspace: build status, approvals, documents and impact numbers.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Workspace · Jip Automation">

<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/site.css?v=202609260756">
<link rel="stylesheet" href="/assets/hub.css?v=202609260756">
<script>try{var t=localStorage.getItem('jip-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<nav class="nav" aria-label="Site">
  <div class="wrap">
    <a class="brand" href="/"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><g fill="none" stroke="var(--bg)" stroke-width="2.6" stroke-linecap="round"><path d="M4 10c2.5-4.5 5.5 4.5 8.5 0c2-3 3.5-1 6-1H28"/><path d="M4 17c2.5-4.5 5.5 4.5 8.5 0c2-3 3.5-1 6-1H28"/><path d="M4 24c2.5-4.5 5.5 4.5 8.5 0c2-3 3.5-1 6-1H28"/></g></svg>Jip Automation</a>
    <div class="right">
      <button class="iconbtn" id="themeBtn" type="button" aria-label="Switch appearance" title="Appearance">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a class="btn ghost" href="/">Back to site</a>
    </div>
  </div>
</nav>
<main id="workspace">
  <div class="ws-signin wrap" id="signinWrap">
    <div class="glow" aria-hidden="true"></div>
    <div class="flow" aria-hidden="true"></div>
    <form class="signin" id="signin" novalidate>
      <span class="tag"><svg viewBox="0 0 24 24"><path d="M3 12h7V3H3zM14 21h7v-9h-7zM14 3v5h7V3zM3 16v5h7v-5z"/></svg>Client workspace</span>
      <h2>Sign in</h2>
      <p>Your build status, approvals, documents and impact numbers, in one place.</p>
      <label>Username<input id="s-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>Password<input id="s-pass" name="password" type="password" autocomplete="current-password" required></label>
      <p class="err" id="s-err" role="alert" hidden>That username or password wasn't found for this workspace.</p>
      <button class="btn primary" id="s-btn" type="submit">Sign in</button>
      <p class="note">Access is by invitation. Need an account? Email carson@jipautomation.com.</p>
    </form>
  </div>

  <div class="ws" id="dash" hidden></div>
</main>

<!-- The workspace shell is only stamped into the page after a successful sign-in. -->
<template id="wsTemplate">
    <div class="ui" id="dashUi">
      <aside class="side" id="side" aria-label="Workspace sections">
        <div class="who"><i data-ws-initials></i><span data-ws-name></span><span class="role" data-ws-role hidden>Admin</span></div>
        <a href="#/dashboard" data-page="dashboard"><svg viewBox="0 0 24 24"><path d="M3 12h7V3H3zM14 21h7v-9h-7zM14 3v5h7V3zM3 16v5h7v-5z"/></svg>Dashboard</a>
        <a href="#/metrics" data-page="metrics"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15v-4M12 15V8M16 15v-6"/></svg>Metrics</a>
        <a href="#/ken" data-page="ken"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Inputs Needed<span class="cnt" data-count="ken"></span></a>
        <div class="grp">Your project</div>
        <a href="#/map" data-page="map"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></svg>Project Map</a>
        <a href="#/lifecycle" data-page="lifecycle"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg>Deal Lifecycle</a>
        <a href="#/workflows" data-page="workflows"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Workflows<span class="cnt" data-count="workflows"></span></a>
        <div class="grp">Reference</div>
        <a href="#/data" data-page="data"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 10h18M9 5v14"/></svg>Data Model<span class="cnt" data-count="data"></span></a>
        <a href="#/glossary" data-page="glossary"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5V4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/></svg>Glossary<span class="cnt" data-count="glossary"></span></a>
        <a href="#/people" data-page="people"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/><circle cx="9" cy="7" r="4"/></svg>People &amp; Roles</a>
        <div class="grp" data-admin-only>Builder</div>
        <a href="#/checklist" data-page="checklist" data-admin-only><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Checklist<span class="cnt" data-count="checklist"></span></a>
        <a href="#/gotchas" data-page="gotchas" data-admin-only><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>Gotchas<span class="cnt" data-count="gotchas"></span></a>
        <a href="#/home" data-page="home" data-admin-only><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg>Build notes</a>
        <div class="grp">Account</div>
        <a href="#/support" data-page="support"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>Support</a>
        <a href="#/settings" data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</a>
        <a href="#" class="signout" data-signout><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</a>
      </aside>
      <div class="main">
        <div class="top"><button type="button" class="btn sm menubtn" id="menuBtn" aria-label="Menu" aria-expanded="false">☰ Menu</button><span class="crumb" id="crumb">Dashboard</span><span>·</span><span data-ws-name></span><span class="sp"></span></div>
        <div class="body" id="view"></div>
        <div class="hub" id="hubView" hidden></div>
      </div>
    </div>
</template>

<template id="tpl-support">
          <div class="row2">
            <div class="panel">
              <div class="ph"><h4>Get in touch</h4><span class="pill run">One business day</span></div>
              <p class="note" style="margin:0">One reply, from Carson. Say what you need and roughly how urgent it is.</p>
              <div class="kv">
                <div class="r"><span>Email</span><b>carson@jipautomation.com</b></div>
                <div class="r" style="border:0"><span>Break-fix response</span><b>Within 1 business day</b></div>
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <a class="btn sm primary" href="mailto:carson@jipautomation.com?subject=Change%20request%20%C2%B7%20workspace">Request a change</a>
                <a class="btn sm" href="mailto:carson@jipautomation.com?subject=Problem%20report%20%C2%B7%20workspace">Report a problem</a>
              </div>
            </div>
            <div class="panel" id="engagement" hidden>
              <div class="ph"><h4>Your engagement</h4><span class="pill run" data-eng-phase></span></div>
              <div class="kv">
                <div class="r"><span>Pricing</span><b>Fixed price per phase</b></div>
                <div class="r"><span>Build progress</span><b data-eng-progress>—</b></div>
                <div class="r"><span>Next gate</span><b data-eng-gate>—</b></div>
                <div class="r" style="border:0"><span>Last update</span><b data-eng-updated>—</b></div>
              </div>
            </div>
          </div>
</template>

<template id="tpl-settings">
          <div class="panel">
            <div class="ph"><h4>Appearance</h4></div>
            <div class="kv">
              <div class="r" style="border:0;align-items:center"><span>Theme</span>
                <div class="seg" role="group" aria-label="Appearance">
                  <button type="button" data-theme-pick="light">Light</button>
                  <button type="button" data-theme-pick="dark">Dark</button>
                  <button type="button" data-theme-pick="system">System</button>
                </div>
              </div>
            </div>
          </div>
          <div class="row2">
            <div class="panel">
              <div class="ph"><h4>Account</h4></div>
              <div class="kv">
                <div class="r"><span>Username</span><b data-ws-user></b></div>
                <div class="r"><span>Workspace</span><b data-ws-name></b></div>
                <div class="r" style="border:0"><span>Role</span><b data-ws-rolename></b></div>
              </div>
              <div><button type="button" class="btn sm" data-signout>Sign out</button></div>
            </div>
            <div class="panel">
              <div class="ph"><h4>Workspace</h4></div>
              <div class="kv">
                <div class="r"><span>Reviewers</span><b>—</b></div>
                <div class="r"><span>Review emails from</span><b>—</b></div>
                <div class="r"><span>Exception owner</span><b>—</b></div>
                <div class="r" style="border:0"><span>Data export</span><b>—</b></div>
              </div>
            </div>
          </div>
</template>
<script src="/assets/site.js?v=202609260756"></script>
</body>
</html>
